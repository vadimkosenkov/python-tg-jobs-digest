name: Run Telegram Job Digest

on:
  schedule:
    # Запуск каждый день в 04:59 по UTC (07:59 по МСК/Минску)
    - cron: '59 4 * * *'
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # нужно, чтобы скачать артефакт прошлого запуска
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install telethon python-dotenv

      # 1. Скачиваем файл состояния из последнего успешного запуска
      # (download-artifact без run-id ищет только в текущем запуске, где файла еще нет)
      - name: Download Previous State
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --workflow "$GITHUB_WORKFLOW" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No previous successful run — starting with an empty state"
            exit 0
          fi
          echo "Restoring state from run $run_id"
          gh run download "$run_id" --name job-state --dir .
          head -c 300 job_digest_state.json
        continue-on-error: true # Если артефакт истек или недоступен — идем дальше с пустым состоянием

      # 2. Запуск вашего Python скрипта (передаем только скрытые доступы к аккаунту)
      - name: Run Digest Script
        env:
          TG_SESSION_BASE64: ${{ secrets.TG_SESSION_BASE64 }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: python3 telegram_job_digest.py

      # 3. GitHub сам берет обновленный файл job_digest_state.json и прячет его на 90 дней
      - name: Upload Current State
        uses: actions/upload-artifact@v4
        with:
          name: job-state
          path: job_digest_state.json
          retention-days: 90
